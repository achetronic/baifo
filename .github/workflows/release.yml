# Release pipeline for baifo.
#
# Triggered by:
#   - Pushing a tag matching v* (e.g. v0.1.0, v1.2.3-rc1) → full
#     release: build artefacts, push Docker images, update the
#     Homebrew tap, draft the GitHub release.
#   - workflow_dispatch (manual) → useful for smoke-testing the
#     pipeline; goreleaser detects the missing tag and runs in
#     --snapshot mode (no publish).
#
# Required repository secrets:
#   - HOMEBREW_TAP_GITHUB_TOKEN
#       PAT with `repo` scope on achetronic/homebrew-baifo. Without
#       it the brews: section in .goreleaser.yaml fails; the rest
#       of the release still works.
#
# Required permissions (declared per-job below):
#   - contents: write     → push the GitHub release
#   - packages: write     → push images to ghcr.io
#   - id-token: write     → reserved for future cosign keyless
#                           signing; harmless if unused today.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # goreleaser needs the full history + tags to compute
          # the changelog and the previous-tag link.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Multi-arch docker builds need buildx + qemu for the
      # foreign-arch image layers (linux/arm64 from an amd64
      # runner). goreleaser drives `docker buildx build` for us;
      # we just have to set the daemon up.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate to GHCR before goreleaser tries to push.
      # ${{ github.actor }} is the user who pushed the tag (or
      # ran the workflow); GITHUB_TOKEN is enough since we asked
      # for packages: write above.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # `~> v2` means "latest v2 release"; goreleaser-action
          # pins to v2 so a future v3 with breaking changes
          # doesn't silently land in our pipeline.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. When the secret is unset, the brews: step
          # in .goreleaser.yaml errors and fails the workflow —
          # which is what we want: a release without a brew
          # update is a half-release.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
