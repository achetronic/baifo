# Release pipeline for baifo.
#
# Triggered by pushing a tag matching v* (e.g. v0.1.0).
#
#   1. checkout with Git LFS (the nomic-embed weights live there)
#   2. sanity-check the .weights file is the real thing and not an
#      LFS pointer (go:embed would bake the pointer in silently and
#      ship binaries with broken embeddings)
#   3. make release       -> cross-compile binaries into dist/
#   4. upload dist/* to the GitHub release for the tag

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The model weights are stored in Git LFS. Without this the
          # checkout leaves a ~130-byte pointer file in place.
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # go:embed would happily bake in an LFS pointer and the build
      # would still pass. Fail loudly instead: the quantized weights
      # are ~132MB, so anything under 100MB means LFS didn't pull.
      - name: Verify model weights
        run: |
          f=internal/embeddings/assets/nomic-embed-text.weights
          test -f "$f" || { echo "::error::$f is missing"; exit 1; }
          size=$(wc -c < "$f")
          echo "weights size: $size bytes"
          test "$size" -gt 100000000 || { echo "::error::$f is too small ($size bytes); looks like an LFS pointer"; exit 1; }

      - name: Build release binaries
        run: make release

      - name: Upload binaries to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
