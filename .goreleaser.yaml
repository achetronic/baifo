# baifo — goreleaser configuration.
#
# Tagged releases (`git tag v0.1.0 && git push --tags`) trigger
# .github/workflows/release.yml which calls goreleaser to:
#   - cross-compile baifo for linux/darwin/windows × amd64/arm64
#     (plus a couple of niche linux arches)
#   - bundle each binary with LICENSE + README into a tar.gz / zip
#   - emit a single SHA256SUMS file
#   - publish a GitHub Release with the changelog grouped by
#     conventional-commits prefix
#   - build & push a multi-arch Docker image to GHCR
#   - update the Homebrew tap formula at achetronic/homebrew-baifo
#
# To smoke-test the config without tagging a release:
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish,sign
#
# See https://goreleaser.com/customization/ for the full schema.

version: 2

project_name: baifo

before:
  hooks:
    # Tidy / verify the module before building so a release never
    # ships with a stale go.sum. `go mod download` is cheap enough
    # to run on every release.
    - go mod tidy
    - go mod download

builds:
  - id: baifo
    main: ./cmd/baifo
    binary: baifo
    # CGO stays off everywhere: baifo is pure Go (modernc.org/sqlite
    # too), and CGO_ENABLED=0 buys us trivial cross-compilation
    # plus a static binary that runs on minimal containers.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Same flags as the Makefile so `go install` and a release
      # binary report identical metadata.
      - -s -w
      - -X github.com/achetronic/baifo/internal/version.tag={{.Version}}
      - -X github.com/achetronic/baifo/internal/version.commit={{.Commit}}
      - -X github.com/achetronic/baifo/internal/version.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      # arm/v7 is interesting for linux (Raspberry Pi etc.) but
      # essentially nobody runs Darwin/Windows/FreeBSD on 32-bit
      # ARM, so we skip those combos to keep the artefact list
      # readable.
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm" }}armv{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}
    # tar.gz on unix, zip on windows — what each platform expects
    # so users don't have to fight with extraction tools.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Drop a couple of contextual files next to the binary so a
    # curl-and-extract install still ships the license and the
    # README.
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Source archive: a self-contained snapshot of the repo at the
# tag. Useful for downstream packagers (Nix, AUR, FreeBSD ports)
# that prefer building from a stable tarball rather than git
# clone.
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

snapshot:
  # Snapshot builds (CI smoke tests, --snapshot) get a synthetic
  # version derived from the next patch + "-SNAPSHOT" so they
  # never collide with a real release tag if they leak out.
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  # Group commits by conventional-commits prefix. Anything that
  # doesn't match a prefix lands in "Other" so nothing is lost.
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Refactoring
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: Other
      order: 999
  filters:
    # Hide noise from the changelog — these commits don't add
    # user-facing value and bloat release notes.
    exclude:
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^style:'
      - '^build:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: achetronic
    name: baifo
  # Don't auto-publish: keep the release as a draft on the first
  # push so we can review the changelog before announcing. Flip
  # to false once the release flow has earned trust.
  draft: true
  # Mark pre-release automatically when the tag has a -rc / -beta
  # suffix. Stable tags (vX.Y.Z) get published as "latest".
  prerelease: auto
  header: |
    ## baifo {{ .Version }}

    Single-binary, terminal-native agent harness. Drop the binary
    in your `$PATH` and run `baifo` — see the README for the
    first-run flow.
  footer: |
    **Full changelog**: https://github.com/achetronic/baifo/compare/{{ .PreviousTag }}...{{ .Tag }}

# ---------------------------------------------------------------------------
# Docker image: pushed to GHCR (free, ties to the repo) on every
# tagged release. Multi-arch via a manifest list, built from the
# already-cross-compiled binaries (so we don't need qemu).
# ---------------------------------------------------------------------------
dockers:
  - id: baifo-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/achetronic/baifo:{{ .Version }}-amd64"
      - "ghcr.io/achetronic/baifo:latest-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/achetronic/baifo"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

  - id: baifo-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/achetronic/baifo:{{ .Version }}-arm64"
      - "ghcr.io/achetronic/baifo:latest-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/achetronic/baifo"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

# Multi-arch manifest list that points at the per-arch images
# above. Pulling `ghcr.io/achetronic/baifo:vX.Y.Z` then resolves
# to the right arch automatically.
docker_manifests:
  - name_template: "ghcr.io/achetronic/baifo:{{ .Version }}"
    image_templates:
      - "ghcr.io/achetronic/baifo:{{ .Version }}-amd64"
      - "ghcr.io/achetronic/baifo:{{ .Version }}-arm64"
  - name_template: "ghcr.io/achetronic/baifo:latest"
    image_templates:
      - "ghcr.io/achetronic/baifo:latest-amd64"
      - "ghcr.io/achetronic/baifo:latest-arm64"

# ---------------------------------------------------------------------------
# Homebrew tap. The formula lives in a separate repo
# (achetronic/homebrew-baifo); goreleaser pushes the updated
# formula on every release. Requires HOMEBREW_TAP_GITHUB_TOKEN
# in the release workflow's environment — a PAT with `repo`
# scope on the tap repo.
# ---------------------------------------------------------------------------
brews:
  - name: baifo
    repository:
      owner: achetronic
      name: homebrew-baifo
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: baifo-release-bot
      email: [email protected]
    commit_msg_template: "baifo: brew formula update for {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/achetronic/baifo"
    description: "Single-binary, terminal-native agent harness."
    license: "Apache-2.0"
    install: |
      bin.install "baifo"
    test: |
      assert_match "baifo version", shell_output("#{bin}/baifo --version")
    # Skip the brew upload entirely on pre-releases — Homebrew users
    # expect the formula to track stable versions only.
    skip_upload: auto
